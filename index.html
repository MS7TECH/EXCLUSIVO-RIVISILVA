        // ===================== PÁGINA PREMIAÇÕES (ROLETA) =====================
        const PremiacoesPage = () => {
            const [historico, setHistorico] = useState([]);
            const [telefonesMap, setTelefonesMap] = useState({});
            const [loading, setLoading] = useState(true);
            const [anoSelecionado, setAnoSelecionado] = useState(new Date().getFullYear());
            const [mesSelecionado, setMesSelecionado] = useState("TODOS");
            const [corteRanking, setCorteRanking] = useState(5);
            const [termoBusca, setTermoBusca] = useState("");
            const [presentes, setPresentes] = useState(["Vale Brinde Master", "Consultoria 1h", "Crédito Rivi 15%"]);
            const [novoPresente, setNovoPresente] = useState("");
            const [girando, setGirando] = useState(false);
            const [anguloAtual, setAnguloAtual] = useState(0);
            const [vencedor, setVencedor] = useState(null);
            const [modalHistorico, setModalHistorico] = useState(null);
            const canvasRef = React.useRef(null);
            const anguloRef = React.useRef(0);

            const normalizarNome = (nome) => {
                if (!nome) return "";
                return nome.toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim().toUpperCase();
            };

            useEffect(() => {
                (async () => {
                    setLoading(true);
                    try {
                        const { data } = await _supabase.from("financeiro").select("*").eq("tipo", "entrada").order("data", { ascending: false });
                        setHistorico(data || []);

                        const { data: ags } = await _supabase.from("agendamentos").select("cliente_nome, telefone").order("id", { ascending: false });
                        if (ags) {
                            const mapa = {};
                            ags.forEach(a => {
                                const n = normalizarNome(a.cliente_nome);
                                if (n && a.telefone && String(a.telefone).trim() && !mapa[n]) {
                                    mapa[n] = String(a.telefone).trim();
                                }
                            });
                            setTelefonesMap(mapa);
                        }
                    } catch (e) {
                        console.error(e);
                    } finally {
                        setLoading(false);
                    }
                })();
            }, []);

            const obterClientesElegiveis = () => {
                const dadosFiltrados = historico.filter(item => {
                    if (!item.data) return false;
                    const [ano, mes] = item.data.split('-');
                    const bateAno = Number(ano) === Number(anoSelecionado);
                    const bateMes = mesSelecionado === "TODOS" || Number(mes) === Number(mesSelecionado);
                    return bateAno && bateMes && item.cliente;
                });

                const clientes = {};
                dadosFiltrados.forEach(item => {
                    const nomeOriginal = (item.cliente || "").trim().toUpperCase();
                    const nomeNorm = normalizarNome(item.cliente);
                    if (!clientes[nomeOriginal]) {
                        const telAg = telefonesMap[nomeNorm] || null;
                        const telFin = item.telefone || item.phone || item.whatsapp || null;
                        clientes[nomeOriginal] = {
                            nome: nomeOriginal,
                            telefone: telAg || telFin || "Não informado",
                            totalServicos: 0,
                            valorTotal: 0,
                            registros: []
                        };
                    }
                    clientes[nomeOriginal].totalServicos += 1;
                    clientes[nomeOriginal].valorTotal += Number(item.valor || 0);
                    clientes[nomeOriginal].registros.push(item);
                    if (clientes[nomeOriginal].telefone === "Não informado") {
                        const telAg = telefonesMap[nomeNorm];
                        if (telAg) clientes[nomeOriginal].telefone = telAg;
                    }
                });

                let lista = Object.values(clientes).sort((a, b) => b.totalServicos - a.totalServicos || b.valorTotal - a.valorTotal);
                if (termoBusca) {
                    const t = termoBusca.toLowerCase();
                    lista = lista.filter(p => p.nome.toLowerCase().includes(t) || (p.telefone && p.telefone.toLowerCase().includes(t)));
                }
                return lista.slice(0, corteRanking);
            };

            const desenharRoleta = (ctx, participantes, anguloGraus) => {
                const width = ctx.canvas.width;
                const height = ctx.canvas.height;
                const raio = width / 2 - 8;
                ctx.clearRect(0, 0, width, height);
                ctx.save();
                ctx.translate(width / 2, height / 2);
                ctx.rotate((anguloGraus * Math.PI) / 180);

                const total = participantes.length || 1;
                const arco = (2 * Math.PI) / total;
                const cores = ['#f4f4f5', '#e4e4e7', '#f4f4f5', '#ededef'];

                participantes.forEach((p, i) => {
                    const anguloInicio = i * arco;
                    const anguloFim = (i + 1) * arco;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, raio, anguloInicio, anguloFim);
                    ctx.closePath();
                    ctx.fillStyle = cores[i % cores.length];
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(191, 149, 63, 0.25)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.save();
                    ctx.rotate(anguloInicio + arco / 2);
                    ctx.textAlign = 'right';
                    ctx.fillStyle = '#27272a';
                    ctx.font = '600 11px Montserrat, sans-serif';
                    const nomeCurto = p.nome.length > 14 ? p.nome.substring(0, 12) + '..' : p.nome;
                    ctx.fillText(nomeCurto, raio - 30, 4);
                    ctx.restore();
                });

                ctx.beginPath();
                ctx.arc(0, 0, 26, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#bf953f';
                ctx.stroke();
                ctx.restore();
            };

            useEffect(() => {
                const participantes = obterClientesElegiveis();
                const canvas = canvasRef.current;
                if (canvas && participantes.length > 0) {
                    const ctx = canvas.getContext('2d');
                    desenharRoleta(ctx, participantes, anguloAtual);
                }
            }, [historico, telefonesMap, anoSelecionado, mesSelecionado, corteRanking, termoBusca, anguloAtual, loading]);

            const girarRoleta = () => {
                const participantes = obterClientesElegiveis();
                if (participantes.length === 0) return alert("Não há participantes elegíveis.");
                if (presentes.length === 0) return alert("Adicione pelo menos um prêmio.");
                if (girando) return;

                setGirando(true);
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const total = participantes.length;
                const indiceVencedor = Math.floor(Math.random() * total);
                const clienteVencedor = participantes[indiceVencedor];
                const presenteSorteado = presentes[Math.floor(Math.random() * presentes.length)];

                const voltasExtras = 6;
                const anguloPorItem = 360 / total;
                const anguloCentroFatia = indiceVencedor * anguloPorItem + anguloPorItem / 2;
                const anguloInicio = anguloRef.current;
                const anguloFinal = anguloInicio + (360 * voltasExtras) + ((270 - anguloCentroFatia - (anguloInicio % 360)) % 360);

                let inicioTempo = null;
                const duracao = 4500;

                const animar = (tempo) => {
                    if (!inicioTempo) inicioTempo = tempo;
                    let progresso = (tempo - inicioTempo) / duracao;
                    if (progresso > 1) progresso = 1;
                    const ease = 1 - Math.pow(1 - progresso, 3);
                    const angulo = anguloInicio + (anguloFinal - anguloInicio) * ease;
                    anguloRef.current = angulo;
                    setAnguloAtual(angulo);
                    desenharRoleta(ctx, participantes, angulo);

                    if (progresso < 1) {
                        requestAnimationFrame(animar);
                    } else {
                        setGirando(false);
                        anguloRef.current = anguloFinal % 360;
                        setAnguloAtual(anguloFinal % 360);
                        setVencedor({ nome: clienteVencedor.nome, telefone: clienteVencedor.telefone, premio: presenteSorteado });
                    }

            async function loadClientes30Dias() {
                setLoading30Dias(true);
                try {
                    const { data, error } = await _supabase
                        .from("agendamentos")
                        .select("cliente_nome, telefone, data_atendimento, servico")
                        .order("data_atendimento", { ascending: false });

                    if (error) throw error;

                    const mapa = {};
                    (data || []).forEach(a => {
                        const nomeKey = (a.cliente_nome || "").trim().toUpperCase();
                        if (!nomeKey) return;
                        if (!mapa[nomeKey] || (a.data_atendimento && a.data_atendimento > mapa[nomeKey].data)) {
                            mapa[nomeKey] = {
                                nome: (a.cliente_nome || "").trim().toUpperCase(),
                                telefone: (a.telefone || "").trim() || "Não informado",
                                data: a.data_atendimento || null,
                                servico: a.servico || ""
                            };
                        }
                    });

                    const hoje = new Date();
                    hoje.setHours(0, 0, 0, 0);

                    const lista = Object.values(mapa)
                        .filter(c => {
                            if (!c.data) return false;
                            const d = new Date(c.data + "T12:00:00");
                            const diff = Math.floor((hoje - d) / (1000 * 60 * 60 * 24));
                            return diff >= 30;
                        })
                        .map(c => {
                            const d = new Date(c.data + "T12:00:00");
                            const dias = Math.floor((hoje - d) / (1000 * 60 * 60 * 24));
                            return { ...c, diasSemAtendimento: dias };
                        })
                        .sort((a, b) => b.diasSemAtendimento - a.diasSemAtendimento);

                    setClientes30Dias(lista);
                } catch (err) {
                    console.error("Erro ao carregar clientes 30 dias:", err);
                    setClientes30Dias([]);
                } finally {
                    setLoading30Dias(false);
                }
            }

            async function loadFrequenciaClientes() {
                setLoadingFrequencia(true);
                try {
                    const { data, error } = await _supabase
                        .from("agendamentos")
                        .select("cliente_nome, data_atendimento, telefone")
                        .order("data_atendimento", { ascending: true });

                    if (error) throw error;

                    const porMes = {};
                    (data || []).forEach(a => {
                        if (!a.data_atendimento || !a.cliente_nome) return;
                        const partes = a.data_atendimento.split("-");
                        if (partes.length < 2) return;
                        const ano = Number(partes[0]);
                        const mes = Number(partes[1]);
                        const chave = `${ano}-${String(mes).padStart(2, "0")}`;
                        const nome = a.cliente_nome.trim().toUpperCase();
                        if (!nome) return;

                        if (!porMes[chave]) {
                            porMes[chave] = {
                                chave,
                                ano,
                                mes,
                                label: `${MESES[mes - 1]} ${ano}`,
                                clientesSet: new Set(),
                                clientes: []
                            };
                        }
                        if (!porMes[chave].clientesSet.has(nome)) {
                            porMes[chave].clientesSet.add(nome);
                            porMes[chave].clientes.push({
                                nome,
                                telefone: (a.telefone || "").trim() || "Não informado"
                            });
                        }
                    });

                    const lista = Object.values(porMes)
                        .map(m => ({
                            chave: m.chave,
                            ano: m.ano,
                            mes: m.mes,
                            label: m.label,
                            total: m.clientes.length,
                            clientes: m.clientes.sort((a, b) => a.nome.localeCompare(b.nome))
                        }))
                        .sort((a, b) => a.chave.localeCompare(b.chave));

                    setFrequenciaData(lista);
                    if (lista.length > 0 && !mesFrequenciaSelecionado) {
                        const doAno = lista.filter(m => m.ano === anoFrequenciaFiltro);
                        const alvo = doAno.length > 0 ? doAno[doAno.length - 1] : lista[lista.length - 1];
                        setMesFrequenciaSelecionado(alvo.chave);
                    }
                } catch (err) {
                    console.error("Erro ao carregar frequência:", err);
                    setFrequenciaData([]);
                } finally {
                    setLoadingFrequencia(false);
                }
            }

            const salvarConfigNatal = async () => {

                }, { onConflict: "id" });

            const gerarEAplicarGradeNatal = async () => {
                if (!diasSelecionadosNatal.length) return alert("Selecione pelo menos um dia no calendário");
                const hI = configNatal.inicio || "08:00";
                const hF = configNatal.fim || "17:00";
                const intervalo = Number(configNatal.intervalo) || 40;
                let [h, m] = hI.split(":").map(Number);
                let totalMin = h * 60 + m;
                const [hFim, mFim] = hF.split(":").map(Number);
                const totalFim = hFim * 60 + mFim;
                const slots = [];
                while (totalMin < totalFim) {
                    slots.push(String(Math.floor(totalMin / 60)).padStart(2, "0") + ":" + String(totalMin % 60).padStart(2, "0"));
                    totalMin += intervalo;
                }
                if (!slots.length) return alert("Nenhum horário gerado. Ajuste início/fim/intervalo.");
                if (!confirm("Gerar e aplicar " + slots.length + " horário(s) (" + hI + " até " + hF + ", a cada " + intervalo + " min) em " + diasSelecionadosNatal.length + " dia(s)?")) return;
                for (const d of diasSelecionadosNatal) {
                    for (const hh of slots) {
                        const { error } = await _supabase.from("horarios_especiais_exclusiva").insert([{ data: d, horario: hh }]);
                        if (error && error.code !== "23505" && !String(error.message || "").toLowerCase().includes("duplicate")) console.error(error);
                    }
                }
                await loadCalendarioNatal();
                alert("Grade aplicada com sucesso!");
            };

                const intervaloNum = Number(tempIntervalo) || 40;

                if (!inicioNorm || !fimNorm || !/^\d{2}:\d{2}$/.test(inicioNorm) || !/^\d{2}:\d{2}$/.test(fimNorm)) {
                    alert("Informe início e fim válidos (HH:MM).");
                    return;
                }

                const [hI, mI] = inicioNorm.split(':').map(Number);
                const [hF, mF] = fimNorm.split(':').map(Number);
                if ((hI * 60 + mI) >= (hF * 60 + mF)) {
                    alert("O horário de início deve ser anterior ao de fim.");
                    return;
                }

                setLoading(true);
                // Tenta salvar com intervalo; se a coluna não existir, salva só início/fim
                let { error } = await _supabase.from('agenda_excecoes').upsert({
                    data: selectedDateISO,
                    hora_inicio: inicioNorm,
                    hora_fim: fimNorm,
                    intervalo_minutos: intervaloNum

                        hora_inicio: inicioNorm,
                        hora_fim: fimNorm

                    const { data: confirmado } = await _supabase

                    const inicioSalvo = String(confirmado?.hora_inicio || inicioNorm).slice(0, 5);
                    const fimSalvo = String(confirmado?.hora_fim || fimNorm).slice(0, 5);
                    const intervaloSalvo = Number(confirmado?.intervalo_minutos) || intervaloNum;

                const [hIni, mIni] = inicioUsar.split(':').map(Number);
                const [hFim, mFim] = fimUsar.split(':').map(Number);
                
                let minutosAtuais = hIni * 60 + mIni;
                const minutosFim = hFim * 60 + mFim;

                const slots = [];
                while (minutosAtuais < minutosFim) {
                    const hh = String(Math.floor(minutosAtuais / 60)).padStart(2, '0');
                    const mm = String(minutosAtuais % 60).padStart(2, '0');
                    slots.push(`${hh}:${mm}`);
                    minutosAtuais += intervaloUsar;

                const extras = horariosExtrasMap[selectedDateISO] || [];
                const combined = [...new Set([...slots, ...extras])];

                    const [ha, ma] = a.split(':').map(Number);
                    const [hb, mb] = b.split(':').map(Number);

                                disabled: loading,
                                className: "w-full bg-zinc-900 text-white font-black py-3 rounded-xl uppercase text-[10px] tracking-[0.1em] hover:bg-[#bf953f] hover:text-black transition-all cursor-pointer"
                            }, 'Salvar Expediente do Dia')
                        ),

                        h("div", { className: "space-y-3 pt-4 border-t border-zinc-100" },
                            h("div", { className: "flex flex-col" },
                                h("span", { className: "text-[10px] font-black text-zinc-900 uppercase tracking-widest" }, "Gerenciar Horários Específicos"),
                                h("span", { className: "text-[9px] text-zinc-400 font-medium" }, "Inative ou edite os horários individuais do dia")
                            ),
                            h("div", { className: "grid grid-cols-3 gap-2 max-h-48 overflow-y-auto p-1 custom-scroll bg-zinc-50 rounded-2xl border border-zinc-100" },
                                gerarSlotsDoDia().map(slot => {
                                    const inativados = horariosInativadosMap[selectedDateISO] || [];
                                    const isInativado = inativados.includes(slot);
                                    const estaEditando = horarioEditando === slot;

                                    if (estaEditando) {
                                        return h("div", { key: slot, className: "p-2 bg-white border border-[#bf953f] rounded-xl flex flex-col gap-1 items-center justify-center col-span-3 shadow-md" },
                                            h("span", { className: "text-[9px] font-bold text-zinc-400 uppercase" }, `Editar ${slot}`),
                                            h("div", { className: "flex gap-2 w-full" },
                                                h("input", { 
                                                    type: "time", 
                                                    value: novoValorHorario, 
                                                    onChange: (e) => setNovoValorHorario(e.target.value),
                                                    className: "bg-zinc-50 border border-zinc-200 p-1.5 rounded-lg text-xs font-bold outline-none flex-1 text-center" 
                                                }),
                                                h("button", {
                                                    onClick: async () => {
                                                        if (!novoValorHorario) return alert("Insira um horário válido.");
                                                        
                                                        await _supabase.from('horarios_bloqueados_pontuais')
                                                            .insert([{ data: selectedDateISO, horario: slot }]);
                                                        
                                                        const { error } = await _supabase.from('horarios_extras')
                                                            .insert([{ data: selectedDateISO, horario: novoValorHorario }]);

                                                        if (error) {
                                                            console.error(error);
                                                            return alert("Erro ao salvar horário no banco de dados.");
                                                        }

                                                        setHorariosInativadosMap(prev => ({
                                                            ...prev,
                                                            [selectedDateISO]: [...(prev[selectedDateISO] || []), slot]
                                                        }));

                                                        setHorariosExtrasMap(prev => ({
                                                            ...prev,
                                                            [selectedDateISO]: [...(prev[selectedDateISO] || []), novoValorHorario]
                                                        }));

                                                        setHorarioEditando(null);
                                                        setNovoValorHorario("");
                                                        alert("Horário editado e salvo com sucesso!");
                                                    },
                                                    className: "bg-[#bf953f] text-black px-3 py-1 rounded-lg text-xs font-black uppercase cursor-pointer"
                                                }, "Salvar"),
                                                h("button", {
                                                    onClick: () => setHorarioEditando(null),
                                                    className: "bg-zinc-200 text-zinc-700 px-2 py-1 rounded-lg text-xs font-bold cursor-pointer"
                                                }, "✕")
                                            )
                                        );
                                    }

                                    return h("div", {
                                        key: slot,
                                        className: `p-2.5 rounded-xl text-xs font-black transition-all flex flex-col items-center justify-center border relative group ${
                                            isInativado ? 'bg-red-600 text-white border-red-700 line-through shadow-sm' : 'bg-white text-zinc-800 border-zinc-200 hover:border-[#bf953f]'
                                        }`
                                    },
                                        h("span", { 
                                            onClick: () => toggleHorarioPontual(slot),
                                            className: "cursor-pointer w-full text-center"
                                        }, slot),
                                        h("div", { className: "flex gap-2 mt-1" },
                                            h("button", {
                                                onClick: () => toggleHorarioPontual(slot),
                                                className: "text-[8px] uppercase tracking-tighter font-bold cursor-pointer underline"
                                            }, isInativado ? 'Ativar' : 'Inativar'),
                                            h("button", {
                                                onClick: () => {
                                                    setHorarioEditando(slot);
                                                    setNovoValorHorario(slot);
                                                },
                                                className: "text-[8px] uppercase tracking-tighter font-bold cursor-pointer text-[#bf953f]"
                                            }, "Editar")
                                        )
                                    );
                                })
                            )
                        ),

                        h("button", { 
                            onClick: () => setIsConfigModalOpen(false),
                            className: "w-full bg-[#bf953f] text-black font-black py-4 rounded-2xl uppercase text-[11px] tracking-[0.2em] hover:bg-zinc-900 hover:text-white transition-all shadow-xl cursor-pointer"
                        }, "Concluir")
                    )
                ),

                isServicoModalOpen && h("div", { className: "fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md" },
                    h("div", { className: "bg-white w-full max-w-md rounded-[2.5rem] overflow-hidden shadow-2xl border-2 border-[#bf953f] relative" },
                        h("button", { 
                            onClick: () => { setIsServicoModalOpen(false); setServicoEditando(null); }, 
                            className: "absolute top-6 right-6 p-2 text-gray-400 hover:text-black hover:bg-gray-100 rounded-full transition-all cursor-pointer font-bold" 
                        }, "✕"),
                        h("div", { className: "p-8 space-y-6" },
                            h("h2", { className: "text-2xl font-black italic uppercase tracking-tighter text-black" }, 
                                servicoEditando ? "Editar " : "Novo ", 
                                h("span", { className: "text-[#bf953f]" }, "Serviço")
                            ),
                            h("form", { onSubmit: handleSaveServico, className: "space-y-4" },
                                h("div", { className: "space-y-1" },
                                    h("label", { className: "text-[9px] font-black text-gray-400 uppercase tracking-widest ml-2" }, "Nome do Serviço"),
                                    h("input", { 
                                        type: "text", 
                                        required: true,
                                        className: "w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none text-[10px] font-black focus:border-[#bf953f]", 
                                        placeholder: "EX: ESMALTAÇÃO EM GEL", 
                                        value: formServico.nome, 
                                        onChange: (e) => setFormServico({...formServico, nome: e.target.value.toUpperCase()}) 
                                    })
                                ),
                                h("div", { className: "grid grid-cols-2 gap-3" },
                                    h("div", { className: "space-y-1" },
                                        h("label", { className: "text-[9px] font-black text-gray-400 uppercase tracking-widest ml-2" }, "Preço (R$)"),
                                        h("input", { 
                                            type: "text", 
                                            required: true,
                                            className: "w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none text-[10px] font-black focus:border-[#bf953f]", 
                                            placeholder: "0,00", 
                                            value: formServico.preco, 
                                            onChange: (e) => setFormServico({...formServico, preco: e.target.value.replace(/[^0-9,.]/g, "")}) 
                                        })
                                    ),
                                    h("div", { className: "space-y-1" },
                                        h("label", { className: "text-[9px] font-black text-gray-400 uppercase tracking-widest ml-2" }, "Duração (min)"),
                                        h("input", { 
                                            type: "number", 
                                            min: "0",
                                            className: "w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none text-[10px] font-black focus:border-[#bf953f]", 
                                            placeholder: "40", 
                                            value: formServico.duracao, 
                                            onChange: (e) => setFormServico({...formServico, duracao: e.target.value}) 
                                        })
                                    )
                                ),
                                h("button", { 
                                    type: "submit", 
                                    className: "w-full py-5 gold-bg text-black font-black uppercase text-[11px] tracking-[0.2em] rounded-2xl shadow-xl cursor-pointer" 
                                }, servicoEditando ? "Salvar Alterações" : "Cadastrar Serviço")
                            )
                        )
                    )
                ),

                h("footer", { className: "fixed bottom-0 w-full bg-white/80 backdrop-blur-md border-t border-gray-100 p-4 text-center z-10" },
                    h("p", { className: "text-[10px] font-bold text-gray-400 uppercase tracking-[0.4em]" }, "© 2026 Rivi Silva Style")
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(Dashboard));
    </script>
</body>
</html>
